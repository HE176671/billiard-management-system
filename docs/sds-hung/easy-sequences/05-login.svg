="929.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1054.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">UserManager</text><rect x="929.0" y="2212" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1054.0" y="2241" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">UserManager</text><line x1="1362.0" y1="145" x2="1362.0" y2="2202" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1237.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1362.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">SignInManager</text><rect x="1237.0" y="2212" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1362.0" y="2241" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">SignInManager</text><line x1="1670.0" y1="145" x2="1670.0" y2="2202" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1545.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><rect x="1545.0" y="2212" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="2241" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><text x="284.0" y="203" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">1. Nhập tên đăng nhập và mật</text><text x="284.0" y="226" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">khẩu</text><path d="M130.0,240 L438.0,240" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="592.0" y="288" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">2. Gửi thông tin đăng nhập</text><path d="M438.0,302 L746.0,302" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="327" width="1100" height="42" rx="5" fill="#f4f7fa" stroke="#b1bfce"/><text x="900" y="354" font-family="Arial" font-size="18" fill="#20364d" text-anchor="middle" font-weight="normal">Kiểm tra yêu cầu hợp lệ trước khi xử lý</text><text x="94" y="418" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Thông tin nhập chưa hợp lệ</text><text x="592.0" y="462" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">3. Hiện lỗi để người dùng nhập</text><text x="592.0" y="485" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">lại</text><path d="M746.0,499 L438.0,499" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="58" y1="524" x2="1742" y2="524" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="73" y="549" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu thông tin nhập hợp lệ</text><text x="900.0" y="592" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">4. Tìm tài khoản theo tên đăng</text><text x="900.0" y="615" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">nhập</text><path d="M746.0,629 L1054.0,629" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1362.0" y="677" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">5. Tra cứu tài khoản</text><path d="M1054.0,691 L1670.0,691" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1362.0" y="739" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">6. Có tài khoản hoặc không tìm thấy</text><path d="M1670.0,753 L1054.0,753" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="900.0" y="801" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">7. Có tài khoản hoặc không tìm</text><text x="900.0" y="824" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">thấy</text><path d="M1054.0,838 L746.0,838" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="108" y="887" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Không tìm thấy tài khoản hoặc bị vô hiệu hóa</text><text x="592.0" y="931" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">8. Báo đăng nhập không thành</text><text x="592.0" y="954" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">công</text><path d="M746.0,968 L438.0,968" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="72" y1="993" x2="1742" y2="993" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="87" y="1018" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu tài khoản hoạt động</text><text x="1054.0" y="1061" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">9. Yêu cầu kiểm tra đăng nhập</text><path d="M746.0,1075 L1362.0,1075" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1208.0" y="1123" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">10. Kiểm tra khóa tạm và mật</text><text x="1208.0" y="1146" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">khẩu</text><path d="M1362.0,1160 L1054.0,1160" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1362.0" y="1208" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">11. Đọc và cập nhật thông tin bảo mật</text><path d="M1054.0,1222 L1670.0,1222" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1362.0" y="1270" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">12. Trả kết quả xử lý</text><path d="M1670.0,1284 L1054.0,1284" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1208.0" y="1332" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">13. Kết quả kiểm tra</text><path d="M1054.0,1346 L1362.0,1346" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="122" y="1395" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Mật khẩu hợp lệ và được phép đăng nhập</text><text x="900.0" y="1439" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">14. Ghi nhận đăng nhập trên trình duyệt</text><path d="M1362.0,1453 L438.0,1453" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1054.0" y="1501" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">15. Đăng nhập thành công</text><path d="M1362.0,1515 L746.0,1515" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="900.0" y="1563" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">16. Lấy quyền khi cần chọn</text><text x="900.0" y="1586" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">trang mở</text><path d="M746.0,1600 L1054.0,1600" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="900.0" y="1648" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">17. Quyền của tài khoản</text><path d="M1054.0,1662 L746.0,1662" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="592.0" y="1710" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">18. Mở trang nội bộ phù hợp</text><path d="M746.0,1724 L438.0,1724" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="86" y1="1749" x2="1742" y2="1749" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="101" y="1774" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu đang bị khóa tạm</text><text x="1054.0" y="1817" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">19. Tài khoản bị khóa tạm</text><path d="M1362.0,1831 L746.0,1831" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="592.0" y="1879" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">20. Báo khóa tạm, không cho</text><text x="592.0" y="1902" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">đăng nhập</text><path d="M746.0,1916 L438.0,1916" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="86" y1="1941" x2="1742" y2="1941" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="101" y="1966" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu sai mật khẩu hoặc chưa được phép đăng nhập</text><text x="1054.0" y="2009" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">21. Không thành công</text><path d="M1362.0,2023 L746.0,2023" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="592.0" y="2071" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">22. Báo lỗi, không cho đăng</text><text x="592.0" y="2094" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">nhập</text><path d="M746.0,2108 L438.0,2108" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="86" y="1371" width="1656" height="762" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="72" y="863" width="1670" height="1288" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="58" y="394" width="1684" height="1775" fill="none" stroke="#7c95ae" stroke-width="1.5"/></svg>