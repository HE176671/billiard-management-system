e="#7893ad"/><text x="900.0" y="1982" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">UserManager</text><line x1="1285.0" y1="145" x2="1285.0" y2="1943" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1160.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1285.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><rect x="1160.0" y="1953" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1285.0" y="1982" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><line x1="1670.0" y1="145" x2="1670.0" y2="1943" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1545.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">SignInManager</text><rect x="1545.0" y="1953" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="1982" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">SignInManager</text><text x="322.5" y="203" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">1. Gửi mật khẩu hiện tại, mới và xác</text><text x="322.5" y="226" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">nhận</text><path d="M130.0,240 L515.0,240" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="265" width="1100" height="42" rx="5" fill="#f4f7fa" stroke="#b1bfce"/><text x="900" y="292" font-family="Arial" font-size="18" fill="#20364d" text-anchor="middle" font-weight="normal">Yêu cầu đăng nhập và kiểm tra yêu cầu hợp lệ</text><text x="94" y="356" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Thông tin nhập chưa hợp lệ</text><text x="322.5" y="400" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">2. Báo thiếu thông tin hoặc mật khẩu</text><text x="322.5" y="423" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">mới chưa hợp lệ</text><path d="M515.0,437 L130.0,437" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="58" y1="462" x2="1742" y2="462" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="73" y="487" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu thông tin nhập hợp lệ</text><text x="707.5" y="530" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">3. Lấy tài khoản đang đăng nhập</text><path d="M515.0,544 L900.0,544" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1092.5" y="592" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">4. Tìm tài khoản từ thông tin đăng nhập</text><path d="M900.0,606 L1285.0,606" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1092.5" y="654" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">5. Có tài khoản hoặc không tìm thấy</text><path d="M1285.0,668 L900.0,668" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="707.5" y="716" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">6. Có tài khoản hoặc không tìm thấy</text><path d="M900.0,730 L515.0,730" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="108" y="779" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Không tìm thấy tài khoản</text><text x="322.5" y="823" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">7. Yêu cầu đăng nhập lại</text><path d="M515.0,837 L130.0,837" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="72" y1="862" x2="1742" y2="862" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="87" y="887" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu tìm thấy tài khoản</text><text x="707.5" y="930" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">8. Yêu cầu đổi mật khẩu</text><path d="M515.0,944 L900.0,944" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1100.0" y="992" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">9. Kiểm tra mật khẩu hiện tại và mật khẩu</text><text x="1100.0" y="1015" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">mới</text><path d="M900.0,1029 h80 v18 h-80" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="122" y="1096" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Mật khẩu hiện tại sai hoặc mật khẩu mới chưa đạt yêu cầu</text><text x="707.5" y="1140" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">10. Đổi mật khẩu không thành công</text><path d="M900.0,1154 L515.0,1154" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="322.5" y="1202" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">11. Báo lỗi, giữ mật khẩu hiện tại</text><path d="M515.0,1216 L130.0,1216" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="86" y1="1241" x2="1742" y2="1241" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="101" y="1266" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu kiểm tra hợp lệ</text><text x="1092.5" y="1309" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">12. Lưu giá trị bảo vệ mật khẩu mới và</text><text x="1092.5" y="1332" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">thông tin bảo mật</text><path d="M900.0,1346 L1285.0,1346" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1092.5" y="1394" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">13. Kết quả cập nhật</text><path d="M1285.0,1408 L900.0,1408" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="707.5" y="1456" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">14. Trả kết quả đổi mật khẩu</text><path d="M900.0,1470 L515.0,1470" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="136" y="1519" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Cập nhật thất bại</text><text x="322.5" y="1563" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">15. Báo không lưu được thay đổi</text><path d="M515.0,1577 L130.0,1577" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="100" y1="1602" x2="1742" y2="1602" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="115" y="1627" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu cập nhật thành công</text><text x="1092.5" y="1670" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">16. Cập nhật thông tin đăng nhập hiện tại</text><path d="M515.0,1684 L1670.0,1684" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="900.0" y="1732" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">17. Ghi nhận lại đăng nhập trên trình duyệt</text><path d="M1670.0,1746 L130.0,1746" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="322.5" y="1794" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">18. Mở lại trang đổi mật khẩu và báo</text><text x="322.5" y="1817" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">thành công</text><path d="M515.0,1831 L130.0,1831" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="100" y="1495" width="1642" height="361" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="86" y="1072" width="1656" height="802" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="72" y="755" width="1670" height="1137" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="58" y="332" width="1684" height="1578" fill="none" stroke="#7c95ae" stroke-width="1.5"/></svg>