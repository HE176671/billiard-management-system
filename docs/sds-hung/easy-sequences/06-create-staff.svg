<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2129" viewBox="0 0 1800 2129"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#365f83"/></marker></defs><rect width="1800" height="2129" fill="white"/><text x="900" y="44" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#20364d">TẠO TÀI KHOẢN NHÂN VIÊN</text><line x1="130.0" y1="145" x2="130.0" y2="2014" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="5.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="130.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Người quản trị</text><rect x="5.0" y="2024" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="130.0" y="2053" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Người quản trị</text><line x1="515.0" y1="145" x2="515.0" y2="2014" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="390.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="515.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">EmployeeController</text><rect x="390.0" y="2024" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="515.0" y="2053" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">EmployeeController</text><line x1="900.0" y1="145" x2="900.0" y2="2014" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="775.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="900.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">ApplicationDbContext</text><rect x="775.0" y="2024" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="900.0" y="2053" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">ApplicationDbContext</text><line x1="1285.0" y1="145" x2="1285.0" y2="2014" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1160.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1285.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">UserManager</text><rect x="1160.0" y="2024" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1285.0" y="2053" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">UserManager</text><line x1="1670.0" y1="145" x2="1670.0" y2="2014" stroke="#a5b6c7" stroke-dasharray="6 5"/><rect x="1545.0" y="77" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="106" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><rect x="1545.0" y="2024" width="250" height="68" rx="6" fill="#eef4fa" stroke="#7893ad"/><text x="1670.0" y="2053" text-anchor="middle" font-family="Arial" font-size="19" fill="#20364d">Cơ sở dữ liệu</text><text x="322.5" y="203" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">1. Gửi thông tin nhân viên mới</text><path d="M130.0,217 L515.0,217" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="242" width="1100" height="42" rx="5" fill="#f4f7fa" stroke="#b1bfce"/><text x="900" y="269" font-family="Arial" font-size="18" fill="#20364d" text-anchor="middle" font-weight="normal">Chỉ người quản trị được tạo; kiểm tra yêu cầu hợp lệ</text><text x="94" y="333" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Thông tin nhập chưa hợp lệ</text><text x="322.5" y="377" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">2. Hiện lỗi để sửa thông tin</text><path d="M515.0,391 L130.0,391" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="58" y1="416" x2="1742" y2="416" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="73" y="441" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu dữ liệu hợp lệ</text><text x="715.0" y="484" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">3. Chuẩn bị thông tin tài khoản</text><path d="M515.0,498 h80 v18 h-80" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="707.5" y="564" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">4. Bắt đầu nhóm các thay đổi</text><path d="M515.0,578 L900.0,578" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1285.0" y="626" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">5. Giữ các thay đổi trong cùng một lần xử lý</text><path d="M900.0,640 L1670.0,640" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="900.0" y="688" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">6. Tạo tài khoản nhân viên</text><path d="M515.0,702 L1285.0,702" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1477.5" y="750" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">7. Lưu tài khoản và giá trị bảo vệ mật</text><text x="1477.5" y="773" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">khẩu</text><path d="M1285.0,787 L1670.0,787" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1477.5" y="835" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">8. Thành công hoặc lỗi</text><path d="M1670.0,849 L1285.0,849" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="900.0" y="897" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">9. Trả kết quả hoặc báo lỗi</text><path d="M1285.0,911 L515.0,911" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="108" y="960" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Tạo tài khoản thất bại</text><text x="707.5" y="1004" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">10. Hủy các thay đổi của lần tạo</text><path d="M515.0,1018 L900.0,1018" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1285.0" y="1066" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">11. Hủy các thay đổi chưa xác nhận</text><path d="M900.0,1080 L1670.0,1080" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="322.5" y="1128" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">12. Báo lỗi, không lộ chi tiết hệ thống</text><path d="M515.0,1142 L130.0,1142" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="72" y1="1167" x2="1742" y2="1167" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="87" y="1192" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu tạo tài khoản thành công</text><text x="900.0" y="1235" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">13. Cấp quyền nhân viên (Staff)</text><path d="M515.0,1249 L1285.0,1249" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1477.5" y="1297" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">14. Lưu quyền nhân viên cho tài khoản</text><path d="M1285.0,1311 L1670.0,1311" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1477.5" y="1359" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">15. Thành công hoặc lỗi</text><path d="M1670.0,1373 L1285.0,1373" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="900.0" y="1421" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">16. Trả kết quả hoặc báo lỗi</text><path d="M1285.0,1435 L515.0,1435" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="122" y="1484" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">alt — Cấp quyền thất bại</text><text x="707.5" y="1528" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">17. Hủy các thay đổi của lần tạo</text><path d="M515.0,1542 L900.0,1542" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1285.0" y="1590" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">18. Hủy cả tài khoản mới và quyền vừa cấp</text><path d="M900.0,1604 L1670.0,1604" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="322.5" y="1652" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">19. Báo không tạo được nhân viên</text><path d="M515.0,1666 L130.0,1666" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="86" y1="1691" x2="1742" y2="1691" stroke="#7c95ae" stroke-dasharray="6 4"/><text x="101" y="1716" font-family="Arial" font-size="18" fill="#20364d" text-anchor="start" font-weight="bold">Nếu cấp quyền thành công</text><text x="707.5" y="1759" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">20. Xác nhận lưu cả hai bước</text><path d="M515.0,1773 L900.0,1773" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="1285.0" y="1821" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">21. Lưu toàn bộ thay đổi</text><path d="M900.0,1835 L1670.0,1835" fill="none" stroke="#365f83" stroke-width="2" marker-end="url(#arrow)"/><text x="322.5" y="1883" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">22. Báo thành công và mở danh sách</text><text x="322.5" y="1906" font-family="Arial" font-size="19" fill="#20364d" text-anchor="middle" font-weight="normal">nhân viên</text><path d="M515.0,1920 L130.0,1920" fill="none" stroke="#365f83" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="86" y="1460" width="1656" height="485" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="72" y="936" width="1670" height="1027" fill="none" stroke="#7c95ae" stroke-width="1.5"/><rect x="58" y="309" width="1684" height="1672" fill="none" stroke="#7c95ae" stroke-width="1.5"/></svg>